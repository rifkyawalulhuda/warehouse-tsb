services:
  db:
    image: postgres:16-alpine
    container_name: tsb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tsb
      POSTGRES_PASSWORD: tsb
      POSTGRES_DB: warehouse_tsb
      TZ: Asia/Jakarta
    ports:
      - '5436:5432'
    volumes:
      - tsb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tsb -d warehouse_tsb']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tsb-db-data:

