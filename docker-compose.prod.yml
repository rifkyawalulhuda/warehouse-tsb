# Produksi: Postgres + API + nginx (frontend statis + reverse proxy).
#
# Pemakaian:
#   cp .env.production.example .env.production
#   docker compose -f docker-compose.prod.yml up -d --build
#
# HTTPS tidak ditangani di sini. Aplikasi berjalan di balik Cloudflare Tunnel
# atau reverse proxy lain yang sudah memegang sertifikat (kamera HP butuh https).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tsb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib diisi}
      POSTGRES_DB: ${POSTGRES_DB:-warehouse_tsb}
      TZ: Asia/Jakarta
    volumes:
      - tsb-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-tsb} -d ${POSTGRES_DB:-warehouse_tsb}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Jakarta
      DATABASE_URL: postgresql://${POSTGRES_USER:-tsb}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-warehouse_tsb}?schema=public
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN wajib diisi, mis. https://gudang.contoh.com}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL wajib diisi}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET wajib diisi}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET wajib diisi}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
    expose:
      - '4000'

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  tsb-db-data:
