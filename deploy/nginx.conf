# nginx untuk produksi: sajikan hasil build Vite dan teruskan /api + /socket.io
# ke kontainer api. HTTPS dipegang Cloudflare Tunnel / reverse proxy di depannya.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Header keamanan untuk semua respons SPA. `helmet` hanya berlaku pada
    # respons API, sedangkan HTML aplikasi datang dari nginx.
    #
    # nginx membuang add_header warisan begitu location memasang add_header
    # sendiri, jadi header ini diulang di setiap location yang menambah header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    # Aset Vite punya hash di nama file, jadi aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache: build baru harus langsung terpakai.
    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.io butuh upgrade ke WebSocket.
    location /socket.io/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Router TanStack menangani rute di klien; semua jalur lain jatuh ke SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 3m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
