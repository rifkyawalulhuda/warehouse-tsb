# nginx untuk produksi: sajikan hasil build Vite dan teruskan /api + /socket.io
# ke kontainer api. HTTPS dipegang Cloudflare Tunnel / reverse proxy di depannya.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Aset Vite punya hash di nama file, jadi aman di-cache lama.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html tidak boleh di-cache: build baru harus langsung terpakai.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Socket.io butuh upgrade ke WebSocket.
    location /socket.io/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # Router TanStack menangani rute di klien; semua jalur lain jatuh ke SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    client_max_body_size 3m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
